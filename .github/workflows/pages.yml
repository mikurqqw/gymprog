name: Publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      preview:
        description: Publish explicitly marked preview with incomplete legal details
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    env:
      IRONCYCLE_PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.preview && '1' || '0' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run audit
      - run: npm run check:content
      - run: npm run check:i18n
      - run: npm run check:security
      - run: npm run build
      - name: Check artifact launch mode
        run: node scripts/check-launch.mjs ${{ env.IRONCYCLE_PREVIEW == '1' && '--preview' || '' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
